[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiqa-data-pipeline"
version = "0.1.0"
description = "Wikipedia Data Engineering & QA Generation Pipeline"
authors = [{name = "Hien", email = "ghien@example.com"}]
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "google-genai>=1.0.0",
    "aiohttp>=3.9.0",
    "transformers>=4.51.0",
    "underthesea>=9.5.0"
]
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "eda*"]

[tool.ruff]
line-length = 119
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
    "node_modules",
]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort, W: pycodestyle warnings
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "eda"]
